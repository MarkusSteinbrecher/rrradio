name: CI / Deploy to GitHub Pages

# Multi-job pipeline. Every push and PR runs the verification jobs
# (web / worker / catalog). The deploy job only runs on push-to-main
# and depends on all three having passed — so a broken test or
# typecheck blocks the GitHub Pages publish.
#
#   web       → typecheck, vitest unit tests, vite build, upload pages artifact
#   worker    → typecheck (tests will land with audit #66 / #75)
#   catalog   → check-duplicates (deterministic, no network)
#   deploy    → publishes the web job's artifact to Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Scope concurrency per workflow + ref. A static `pages` group meant ANY
# run on ANY branch (e.g. a Dependabot PR) cancelled the in-progress main
# deploy — which silently dropped publishes. Per-ref keeps each branch in
# its own lane: a new push to main supersedes an older one, but unrelated
# PR runs can't cancel the main deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # Web app: typecheck + unit tests + build
  # ────────────────────────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # Pages artifact upload is only needed for the deploy job, which
      # gates on main+push. Skip it on PR runs to save artifact storage.
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: dist
      # Persist dist for the e2e job so we don't rebuild.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  # ────────────────────────────────────────────────────────────
  # End-to-end smoke: real Chromium against the built bundle
  # served via `vite preview`. Audit #63.
  # ────────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: web
    # Run inside the official Playwright image: Chromium and its system
    # libraries are baked in, so there's no `playwright install` download
    # step — which is what deadlocked on Node 24 (#448). The image tag
    # MUST match the playwright version in package-lock.json (1.59.1) so
    # the pre-baked browser revision matches and nothing re-downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # setup-node still pins Node 24 (overriding the image's bundled
      # Node) so `npm ci` keeps working against the npm-11 lockfile.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # No browser install: the image provides Chromium at
      # $PLAYWRIGHT_BROWSERS_PATH (/ms-playwright) for playwright 1.59.1.
      - name: Smoke tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Cloudflare Worker: typecheck + vitest unit tests
  # (deploy lives in deploy-worker.yml, gated on worker/** changes)
  # ────────────────────────────────────────────────────────────
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install worker deps
        working-directory: worker
        run: npm ci
      - name: Typecheck worker
        working-directory: worker
        run: npm run typecheck
      - name: Test worker
        working-directory: worker
        run: npm test

  # ────────────────────────────────────────────────────────────
  # Catalog: deterministic structural checks (no Radio Browser calls).
  #   - check-catalog: stations.yaml ↔ stations.json must be in sync.
  #     Catches "edited YAML, forgot to run npm run catalog before
  #     committing".
  #   - check-highlights: highlights.yaml ↔ highlights.json in sync, and
  #     every featured station id is published.
  #   - check-duplicates: no two stations share a uuid / streamUrl /
  #     normalised name.
  # ────────────────────────────────────────────────────────────
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check-catalog
      - run: npm run check-highlights
      - run: npm run check-duplicates

  # ────────────────────────────────────────────────────────────
  # Deploy: only on push-to-main, only after all checks pass.
  # ────────────────────────────────────────────────────────────
  deploy:
    needs: [web, worker, catalog, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
