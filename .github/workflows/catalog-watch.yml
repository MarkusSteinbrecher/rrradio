name: Catalog refresh (manual)

# Manual Radio Browser refresh + auto-curate entry point.
#
# The weekly health sweep that used to live here moved to
# `station-probe.yml` per ADR 002 (design/decisions/002-catalog-quality-loop.md):
# probing, drift and logo status now run daily in shards and write to the
# orphan `health-data` branch, and the findings arrive as the weekly
# `catalog-quality` digest instead of a log dump. Keeping the RB refresh
# on a schedule was what made this job fail 12 of its last 15 runs — a
# 2 h mirror-dependent step in front of everything else — so it is now
# dispatch-only, run when a curator actually wants a fresh catalog.
#
# What it still does: refresh public/stations.json from Radio Browser,
# check duplicates, surface curation candidates + backlog, open the
# refreshed-reports PR, auto-curate top-played stations into YAML stubs,
# and open (or close) a tracking issue labelled `catalog-watch` when the
# duplicate / candidate signal needs a look.

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # The RB refresh is the long pole (~2 h, most of it favicon-variant
    # regeneration). No probe sweep here any more — that lives in
    # station-probe.yml — so the old 5.5 h ceiling is gone.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same pin as deploy.yml. A hardcoded node 22 here kept failing
          # `npm ci` for five weeks after the lockfile moved to npm 11.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Refresh catalog from Radio Browser
        run: |
          # Production deploys consume the committed public/stations.json
          # (audit #65 — no live RB call on every deploy). This is the
          # explicit refresh path; the commit happens in the consolidated
          # "Commit refreshed reports" step below.
          npm run catalog

      - name: Check for duplicate stations
        id: duplicates
        run: |
          set +e
          npm run check-duplicates > duplicates.txt 2>&1
          EXIT=$?
          tail -c 16000 duplicates.txt
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          if [ "$EXIT" -ne 0 ]; then
            echo "has_issues=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show curation candidates
        run: npm run candidates 2>&1 | tee candidates.txt

      - name: Refresh station backlog (analyzed candidates)
        run: npm run backlog
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Combine outcomes
        id: combined
        run: |
          if [ "${{ steps.duplicates.outputs.has_issues }}" = "true" ]; then
            echo "has_issues=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open refreshed-reports PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `main` is protected and requires status checks, so this sweep
          # cannot push to it directly — a direct push is rejected with
          # GH006 before any check can run, which silently killed every
          # run from 2026-06-22 to 2026-08-12 and froze the health record
          # (and with it the broken-station demotion propose-fixes feeds
          # on) at the last successful sweep. Same branch-and-PR shape the
          # auto-curate step below already uses.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The health / status / drift / logo records are NOT committed
          # here any more — station-probe.yml derives them onto the
          # `health-data` branch (ADR 002), and deploy.yml overlays the
          # record into dist/ from there.
          git add public/stations.json \
                  public/station-duplicates.json public/station-backlog.json
          if git diff --cached --quiet; then
            echo "All reports unchanged."
            exit 0
          fi

          # Reuse the open report PR if last week's is still unmerged, so
          # these large generated diffs don't stack up one branch a week.
          OPEN_PR=$(gh pr list --label catalog-watch --state open --json number --jq '.[0].number // ""')
          if [ -n "$OPEN_PR" ]; then
            BRANCH=$(gh pr view "$OPEN_PR" --json headRefName --jq .headRefName)
            git checkout -B "$BRANCH"
          else
            BRANCH="auto/catalog-watch-$(date -u +'%Y%m%d-%H%M')"
            git checkout -b "$BRANCH"
          fi

          git commit -m "Catalog refresh: Radio Browser catalog + duplicate / backlog reports"
          git push --force-with-lease origin "$BRANCH"

          if [ -n "$OPEN_PR" ]; then
            gh pr comment "$OPEN_PR" --body "Refreshed by the $(date -u +'%Y-%m-%d') sweep."
          else
            gh label create catalog-watch \
              --description "Manual catalog refresh" \
              --color 1D76DB --force >/dev/null 2>&1 || true
            {
              echo "Generated artifacts from a manual catalog refresh —"
              echo "\`public/stations.json\` plus the duplicate / backlog"
              echo "records. No hand-written changes."
              echo
              echo "The diff is large and generated; the signal worth reading is"
              echo "the tracking issue this run opens. Station health is no"
              echo "longer part of this diff — \`station-probe.yml\` refreshes it"
              echo "daily onto the \`health-data\` branch (ADR 002)."
            } > report-pr-body.md
            gh pr create \
              --title "Catalog refresh: Radio Browser catalog + reports" \
              --label catalog-watch \
              --body-file report-pr-body.md
          fi

          # Back to main so the auto-curate step below branches off main
          # rather than off this report branch. auto-curate.mjs reads and
          # writes data/stations.yaml only, so dropping the regenerated
          # public/* artifacts here costs it nothing.
          git checkout -f main

      - name: Auto-curate (Radio Browser → YAML stubs)
        id: curate
        run: |
          # Skip if a previous auto-curate PR is still open — avoids
          # piling up stacked PRs that all touch the same file.
          OPEN_PR=$(gh pr list --label auto-curate --state open --json number --jq '.[0].number // ""')
          if [ -n "$OPEN_PR" ]; then
            echo "Open auto-curate PR #$OPEN_PR — skipping import this run."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run auto-curate 2>&1 | tee curate.txt
          if git diff --quiet data/stations.yaml; then
            echo "No new stations imported."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open auto-curate PR
        if: steps.curate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create auto-curate \
            --description "Auto-imported station stubs awaiting review" \
            --color 0E8A16 --force >/dev/null 2>&1 || true

          BRANCH="auto/curate-$(date -u +'%Y%m%d-%H%M')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/stations.yaml
          git commit -m "Auto-curate: import top-played stations from Radio Browser"
          git push origin "$BRANCH"

          {
            echo "Imported by the manual catalog-refresh workflow."
            echo "Each entry is at \`status: stream-only\` — plays straightforwardly via ICY,"
            echo "no broadcaster-specific metadata fetcher wired yet."
            echo
            echo "**Review checklist before merging**"
            echo "- [ ] Station name / stream URL look right"
            echo "- [ ] Tags + country make sense"
            echo "- [ ] favicon URL renders something usable (otherwise drop the line)"
            echo "- [ ] If the broadcaster has a metadata API worth wiring, change \`broadcaster: independent\`"
            echo "      to a real entry (or add one to \`data/broadcasters.yaml\`) and bump status to \`working\`"
            echo
            echo "### auto-curate output"
            echo
            echo '```'
            cat curate.txt
            echo '```'
          } > pr-body.md

          NEW_COUNT=$(grep -cE '^  \+ ' curate.txt || echo 0)
          gh pr create \
            --title "Auto-curate: import ${NEW_COUNT} station(s) from Radio Browser" \
            --label auto-curate \
            --body-file pr-body.md \
            --head "$BRANCH" \
            --base main

      - name: Open or update tracking issue
        if: steps.combined.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create catalog-watch \
            --description "A manual catalog refresh surfaced something to look at" \
            --color B60205 --force >/dev/null 2>&1 || true

          {
            echo "Last run: $(date -u +'%Y-%m-%d %H:%M UTC')  ·  [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo "Station health is not in this issue — it moved to the weekly"
            echo "\`catalog-quality\` digest written by \`station-probe.yml\` (ADR 002)."
            echo
            echo "### check-duplicates"
            echo
            echo '```'
            tail -c 16000 duplicates.txt
            echo '```'
            echo
            echo "### candidates (top played, not curated)"
            echo
            echo '```'
            cat candidates.txt
            echo '```'
          } > body.md

          NUM=$(gh issue list --label catalog-watch --state open --json number --jq '.[0].number // ""')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file body.md
            gh issue comment "$NUM" --body "Re-checked $(date -u +'%Y-%m-%d %H:%M UTC') — still has issues. Body updated."
          else
            gh issue create \
              --title "Catalog refresh: duplicates / candidates need attention" \
              --label catalog-watch \
              --body-file body.md
          fi

      - name: Close tracking issue if all clean
        if: steps.combined.outputs.has_issues != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --label catalog-watch --state open --json number --jq '.[0].number // ""')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Catalog clean as of $(date -u +'%Y-%m-%d %H:%M UTC'). Closing."
          fi
