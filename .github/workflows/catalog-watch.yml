name: Catalog watch

# Weekly health sweep of the station catalog (docs/station-health.md).
# Refreshes the catalog from Radio Browser, probes every published
# station's stream + metadataUrl into the unified health record, checks
# RB drift, duplicates, and logo state, surfaces curation candidates
# from GoatCounter top-plays, and commits all refreshed report
# artifacts in a single push (one downstream Pages deploy, not four).
# When something needs attention, opens (or updates) a single tracking
# issue labelled `catalog-watch`; when everything's clean, closes it.

on:
  schedule:
    - cron: '0 7 * * 1' # Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # The probe sweep is bounded (concurrency 24, 8 s timeouts → worst
    # case ~2.2 h for 24k stations), but leave generous headroom — the
    # job used to die at the 6 h ceiling when the probes were sequential.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same pin as deploy.yml. A hardcoded node 22 here kept failing
          # `npm ci` for five weeks after the lockfile moved to npm 11.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Refresh catalog from Radio Browser
        run: |
          # Production deploys consume the committed public/stations.json
          # (audit #65 — no live RB call on every deploy). This is the
          # explicit refresh path; the commit happens in the consolidated
          # "Commit refreshed reports" step below.
          npm run catalog

      - name: Probe station health
        id: validate
        run: |
          set +e
          npm run health -- --strict --concurrency 24 --quiet > validate.txt 2>&1
          EXIT=$?
          tail -c 64000 validate.txt
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          if [ "$EXIT" -ne 0 ]; then
            echo "has_issues=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Radio Browser drift
        id: drift
        run: |
          set +e
          npm run check-drift > drift.txt 2>&1
          EXIT=$?
          tail -c 16000 drift.txt
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          if [ "$EXIT" -ne 0 ]; then
            echo "has_issues=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for duplicate stations
        id: duplicates
        run: |
          set +e
          npm run check-duplicates > duplicates.txt 2>&1
          EXIT=$?
          tail -c 16000 duplicates.txt
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          if [ "$EXIT" -ne 0 ]; then
            echo "has_issues=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh logo status
        run: npm run logo-status -- --json-only

      - name: Show curation candidates
        run: npm run candidates 2>&1 | tee candidates.txt

      - name: Refresh station backlog (analyzed candidates)
        run: npm run backlog
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Combine outcomes
        id: combined
        run: |
          if [ "${{ steps.validate.outputs.has_issues }}" = "true" ] \
             || [ "${{ steps.drift.outputs.has_issues }}" = "true" ] \
             || [ "${{ steps.duplicates.outputs.has_issues }}" = "true" ]; then
            echo "has_issues=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stations.json \
                  public/station-health.json public/station-status.json \
                  public/station-drift.json public/station-duplicates.json \
                  public/station-logo-status.json public/station-backlog.json
          if git diff --cached --quiet; then
            echo "All reports unchanged."
          else
            git commit -m "Catalog-watch: weekly health sweep + report refresh"
            # --autostash: the tree may hold regenerated-but-uncommitted
            # build outputs (favicon variants, highlights) — same parity
            # as the old per-step commits, which also left them behind.
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Auto-curate (Radio Browser → YAML stubs)
        id: curate
        run: |
          # Skip if a previous auto-curate PR is still open — avoids
          # piling up stacked PRs that all touch the same file.
          OPEN_PR=$(gh pr list --label auto-curate --state open --json number --jq '.[0].number // ""')
          if [ -n "$OPEN_PR" ]; then
            echo "Open auto-curate PR #$OPEN_PR — skipping import this run."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run auto-curate 2>&1 | tee curate.txt
          if git diff --quiet data/stations.yaml; then
            echo "No new stations imported."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open auto-curate PR
        if: steps.curate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create auto-curate \
            --description "Auto-imported station stubs awaiting review" \
            --color 0E8A16 --force >/dev/null 2>&1 || true

          BRANCH="auto/curate-$(date -u +'%Y%m%d-%H%M')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/stations.yaml
          git commit -m "Auto-curate: import top-played stations from Radio Browser"
          git push origin "$BRANCH"

          {
            echo "Imported by the weekly catalog-watch workflow."
            echo "Each entry is at \`status: stream-only\` — plays straightforwardly via ICY,"
            echo "no broadcaster-specific metadata fetcher wired yet."
            echo
            echo "**Review checklist before merging**"
            echo "- [ ] Station name / stream URL look right"
            echo "- [ ] Tags + country make sense"
            echo "- [ ] favicon URL renders something usable (otherwise drop the line)"
            echo "- [ ] If the broadcaster has a metadata API worth wiring, change \`broadcaster: independent\`"
            echo "      to a real entry (or add one to \`data/broadcasters.yaml\`) and bump status to \`working\`"
            echo
            echo "### auto-curate output"
            echo
            echo '```'
            cat curate.txt
            echo '```'
          } > pr-body.md

          NEW_COUNT=$(grep -cE '^  \+ ' curate.txt || echo 0)
          gh pr create \
            --title "Auto-curate: import ${NEW_COUNT} station(s) from Radio Browser" \
            --label auto-curate \
            --body-file pr-body.md \
            --head "$BRANCH" \
            --base main

      - name: Open or update tracking issue
        if: steps.combined.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create catalog-watch \
            --description "Weekly station validation surfaced something to look at" \
            --color B60205 --force >/dev/null 2>&1 || true

          {
            echo "Last run: $(date -u +'%Y-%m-%d %H:%M UTC')  ·  [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo "Full per-station verdicts: \`public/station-health.json\` · tracker Health tab"
            echo
            echo "### health probe"
            echo
            echo '```'
            tail -c 32000 validate.txt
            echo '```'
            echo
            echo "### check-drift"
            echo
            echo '```'
            tail -c 16000 drift.txt
            echo '```'
            echo
            echo "### check-duplicates"
            echo
            echo '```'
            tail -c 16000 duplicates.txt
            echo '```'
            echo
            echo "### candidates (top played, not curated)"
            echo
            echo '```'
            cat candidates.txt
            echo '```'
          } > body.md

          NUM=$(gh issue list --label catalog-watch --state open --json number --jq '.[0].number // ""')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file body.md
            gh issue comment "$NUM" --body "Re-checked $(date -u +'%Y-%m-%d %H:%M UTC') — still has issues. Body updated."
          else
            gh issue create \
              --title "Catalog watch: stations need attention" \
              --label catalog-watch \
              --body-file body.md
          fi

      - name: Close tracking issue if all clean
        if: steps.combined.outputs.has_issues != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --label catalog-watch --state open --json number --jq '.[0].number // ""')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "All stations OK as of $(date -u +'%Y-%m-%d %H:%M UTC'). Closing."
          fi
