# User-suggested stations — intake list for the `user-suggestions` source.
#
# One row per suggestion, appended when a listener proposes a station
# (usually a GitHub issue via docs/adding-stations.md). Hand-maintained;
# git history is the audit trail. Read by tools/build-sources.mjs.
#
# Row fields:
#   name          — station name as suggested.
#   country       — ISO 3166-1 alpha-2 (uppercase).
#   streamUrl     — direct stream URL if known.
#   homepage      — station homepage.
#   suggestedVia  — where the suggestion came from (issue URL, email, …).
#   suggestedAt   — YYYY-MM-DD.
#   triage        — new | accepted | rejected.
#   triageNote    — short reason (especially for rejected).
#
# When a suggestion is accepted and imported, the catalog entry in
# data/stations.yaml MUST set `source: user-suggestions` — build-sources
# matches intake rows to catalog entries by stream URL and reports the
# pipeline (new / accepted / rejected / imported) on the tracker.
#
# Example row:
#   - name: Radio Example
#     country: DE
#     streamUrl: https://stream.example.org/live.mp3
#     homepage: https://example.org/
#     suggestedVia: https://github.com/MarkusSteinbrecher/rrradio/issues/999
#     suggestedAt: 2026-06-10
#     triage: new

[]
