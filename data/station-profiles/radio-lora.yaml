id: radio-lora

identity:
  name: Radio LoRa
  shortName: LoRa
  tagline: The Revolution Will Not Be Tweeted
  positioning: Das freie Radio von Zürich — intercultural community radio
  logo:
    url: ""
    source: ""

organization:
  type: community
  owner: Verein Radio LoRa (non-profit)
  group: independent / community
  foundedYear: 1981
  headquarters: { city: Zürich, address: "Militärstrasse 85a, 8004 Zürich", canton: ZH }

profile:
  description: >-
    Switzerland's oldest community radio — 250+ volunteer hosts broadcasting
    24/7, ad-free, eclectic music and political/cultural talk in 21 languages
    from Zürich's Kreis 4.
  format: Community / freeform
  contentMix: { music: 0.5, talk: 0.5 }
  targetAudience: >-
    groups and individuals underrepresented in mainstream media; intercultural
    Zürich (every third resident's daily life isn't only in Swiss German)
  distinctive: >-
    21 broadcast languages, explicitly political/feminist/anti-establishment,
    strictly non-commercial. Born of Zürich's 1980s youth movement.

music:
  genres: [community, freeform, world, experimental, electronic, talk, political]
  languageShare: { multilingual: true }
  rotationStyle: freeform
  playlistSample:
    sampledAt: 2026-06-21
    source: https://www.lora.ch/radio/tracklist
    tracks:
      - { artist: Panda Lux, title: "—" }
      - { artist: Lost in Lona, title: "—" }
      - { artist: Bob Marley, title: "—" }
      - { artist: Nina Simone, title: "—" }
  notes: >-
    Not a rotation station — music is curated per-show by volunteers; the live
    signal is often spoken-word. The defining signal is the SHOW GRID + its
    languages, not a now-playing artist.

