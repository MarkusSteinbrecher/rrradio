meta:
  status: working
  liveness: { onDab: false, inRadioplayer: true }
  provenance:
    streams: live9.avf.ch/status-json.xsl (Icecast mounts)
    teamBios: ipmusic.ch/ipmusic-pro.php
    targetAudience: ipmusic.ch/ipmusic-pub.php
    logo: radioplayer.org (seed)
    headquarters: ipmusic.ch/ipmusic-pro.php contact section
    playlist: ipmusic.ch/playlist.php + Icecast ICY title fields
  updatedAt: 2026-06-22
  notes: >-
    Internet-only station; the DAB+ navigation in the page source is commented out — no
    confirmed DAB+ broadcast. Backed by two companies: Audio Visual Factory (avf.ch,
    runs the Icecast servers live7/live9.avf.ch) and IP worldcom (managed by Dany Hofmann
    who also co-founded KTFM and MFM). The playlist.php endpoint returns cover art but
    lacks CORS — use Icecast status-json for the now-playing title, or proxy playlist.php
    for cover art. Sister stations on the same Icecast cluster: IP music SLOW, MaXXima,
    Global FM, Global Sport, LFM, Funky24.
