id: ip-music

identity:
  name: IP music
  shortName: IP music
  tagline: "Hit & Classe"
  positioning: Swiss internet radio — all the best hits, no talk (30–50 ans)
  logo:
    url: https://assets.radioplayer.org/756/75610008/600/600/l5uoii6r.png
    source: radioplayer

organization:
  type: internet
  owner: IP worldcom / Dany Hofmann
  group: IP music (IP music + IP music SLOW + MaXXima)
  headquarters: { city: Préverenges, address: "CP 43, 1028 Préverenges", canton: VD }

profile:
  description: >-
    Swiss French-language internet radio broadcasting all the best hits with no talk,
    targeting 30–50 year-old listeners. Part of a trio of digital stations (IP music,
    IP music SLOW, MaXXima) operated by Audio Visual Factory / IP worldcom.
  format: Adult Contemporary / Hot AC / 80s-pop
  contentMix: { music: 1.0, talk: 0.0 }
  targetAudience: 30–50 year-old French-speaking Swiss listeners
  distinctive: >-
    100% music, no talk, no interruptions — pure playlist rotation mixing current
    hits with 1980s pop, disco, and soul. The station explicitly brands itself
    "Hit & Classe", running commercial rotation 24/7 without live presenters.

music:
  genres: [pop, rock, 80s, disco, adult-contemporary, soul, top40]
  languageShare: { intl: high, fr: low }
  rotationStyle: current-hits
  playlistSample:
