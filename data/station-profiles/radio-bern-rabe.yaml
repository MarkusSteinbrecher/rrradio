id: radio-bern-rabe

identity:
  name: Radio Bern RaBe
  shortName: RaBe
  tagline: "Das Berner Kulturradio mit Musik und Themen die in anderen Medien zu kurz kommen."
  positioning: >-
    Free community radio from Bern — eclectic music and progressive talk,
    ad-free, run by ~200 volunteers in 20+ languages.
  logo:
    url: https://assets.radioplayer.org/756/756141/600/600/l458naih.png
    source: radioplayer
  brandColor: "#00635F"

organization:
  type: community
  owner: Verein Radio Bern RaBe (non-profit association)
  group: independent / community
  foundedYear: 1993   # association founded 1993-06-17; on-air from 1996-03-01
  headquarters:
    city: Bern
    address: "Sulgenrain 28, 3007 Bern"   # moved to Marziliquartier in 2025
    canton: BE

profile:
  description: >-
    Bern's independent community radio — ~200 volunteer hosts broadcasting 24/7,
    ad-free, mixing eclectic and alternative music with progressive news and
    cultural talk across 20+ languages. Funded by ~1,000 members plus public fees.
  format: Community / freeform + Alternative / eclectic
  contentMix: { music: 0.65, talk: 0.35 }
  targetAudience: >-
    Bern residents interested in alternative and underground music, progressive
    politics, and media voices underrepresented in mainstream outlets; multilingual
    communities across the city.
  distinctive: >-
    Genuinely freeform rotation — music spans RATM and Daft Punk to reggae, hip-hop,
    postpunk, Swiss acts and world music within a single shift. Daily news show
    (RaBe-Info) with trained volunteer journalists; 20+ languages across the show
    grid; fully ad-free and non-commercial since 1996.

