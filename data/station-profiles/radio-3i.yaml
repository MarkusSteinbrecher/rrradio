id: radio-3i

identity:
  name: Radio 3i
  shortName: 3i
  tagline: "informazione · intrattenimento · integrazione"
  positioning: the most listened-to private radio in Ticino
  logo:
    url: https://radio3i.ch/assets/images/app-logo.png
    source: broadcaster

organization:
  type: commercial
  owner: Gruppo Corriere del Ticino (via Timedia / mediaTI)
  group: Corriere del Ticino
  foundedYear: 1987
  headquarters: { city: Melide, address: "Melide", canton: TI }   # founded in Mendrisio 1987

profile:
  description: >-
    Ticino's most-listened private radio — Italian-language adult contemporary
    mixing Italian pop with international hits, plus regional news and lively
    talk shows, from the Corriere del Ticino media group.
  format: Adult Contemporary
  contentMix: { music: 0.7, talk: 0.3 }
  targetAudience: Italian-speaking adults across Ticino
  distinctive: >-
    Deliberately high Italian-language music share (~50%), distinctly above a
    generic European AC station — a defining Ticino trait. Guinness record in
    2018 for a 100-hour broadcast.

