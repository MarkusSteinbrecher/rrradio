profile:
  description: >-
    Online-only sub-channel of Radio 32 spinning classic hits from the 1950s through
    the 1990s — a golden-oldies stream for listeners who want the original Radio 32
    format without the talk, news or contemporary pop.
  format: Golden Oldies
  contentMix: { music: 1.0, talk: 0.0 }
  targetAudience: 35–65 listeners in the Mittelland region who grew up with 60s–90s pop and rock
  distinctive: >-
    Launched in 2001 as Radio 32's second programme, distributed by cable and internet
    only (no FM transmitters of its own). Spans an unusually wide era window — from
    50s rock'n'roll through 90s pop — making it broader than a typical decade-locked
    oldies channel.

