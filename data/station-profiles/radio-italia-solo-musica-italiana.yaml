identity:
  name: Radio Italia Solo Musica Italiana
  shortName: Radio Italia
  tagline: Solo Musica Italiana
  positioning: Italy's leading all-Italian-music station — exclusively Italian-language pop, soul, and singer-songwriter
  logo:
    url: https://assets.radioplayer.org/756/7568001/600/600/l458qi37.png
    source: radioplayer

organization:
  type: commercial
  owner: Radio Italia S.p.A.
  group: Radio Italia
  foundedYear: 1982
  headquarters: { city: Cologno Monzese, address: "Viale Europa 49, 20093 Cologno Monzese (MI)", canton: null }

profile:
  description: >-
    Italy's third-most-listened-to national radio (4.9 million daily listeners, 2024),
    playing exclusively Italian music — pop, soul, ballads, and singer-songwriter —
    no foreign-language tracks ever. Founded 1982 by musician Mario Volanti.
  format: Adult Contemporary / Italian-language pop
  contentMix: { music: 0.90, talk: 0.10 }
  targetAudience: Italian-speaking adults 25–55 who prefer domestic pop over international hits
  distinctive: >-
    100 % Italian-language rotation is the hard editorial rule — a uniquely rare
    format that makes it the go-to station for Italian-speaking diaspora worldwide,
    including DAB+ coverage across Italian-speaking Switzerland (Ticino, Bern, Geneva).

