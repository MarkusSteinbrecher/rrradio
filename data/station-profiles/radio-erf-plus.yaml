id: radio-erf-plus

identity:
  name: Radio ERF Plus
  shortName: ERF Plus
  tagline: Tut einfach gut
  positioning: Das christliche 24-Stunden-Radioprogramm — Musik und geistliche Impulse für den Alltag
  logo:
    url: https://assets.radioplayer.org/756/756134/600/600/l459snv3.png
    source: radioplayer

organization:
  type: internet
  owner: ERF Medien e.V. (Germany) / ERF Medien Schweiz (CH distribution)
  group: ERF Medien
  foundedYear: 1959   # ERF Medien e.V. Wetzlar, Germany; Swiss association founded 1973
  headquarters: { city: Pfäffikon ZH, address: "Witzbergstrasse 23, CH-8330 Pfäffikon ZH", canton: ZH }

profile:
  description: >-
    Christian 24-hour radio from ERF Medien — a mix of contemporary Christian
    music (German and English), daily devotionals, and faith-themed talk shows.
    Broadcast in German-speaking Switzerland via DAB+ and internet streaming.
  format: Christian AC / Inspirational Talk
  contentMix: { music: 0.65, talk: 0.35 }
  targetAudience: German-speaking Christians and faith-seeking adults across Switzerland and Germany
  distinctive: >-
    Combines a mainstream-adjacent Christian music rotation with daily spoken-word
    devotionals (Anstoß, Wort zum Tag, Bibel heute) — listener-funded with no
    advertising. Swiss DAB+ presence alongside the German broadcast reach.

