profile:
  description: >-
    Swiss internet radio station broadcasting country, rock, Americana, rockabilly
    and blues — the unofficial Swiss home of the Billboard Country Charts and
    old-school rock'n'roll, streaming 24/7 from Chur.
  format: Country / Rock / Americana
  contentMix: { music: 0.90, talk: 0.10 }
  targetAudience: Country and rock fans in Switzerland and the German-speaking world
