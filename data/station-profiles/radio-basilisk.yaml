profile:
  description: >-
    Basel's own local commercial hits station, on air since 1 November 1983 — one of
    Switzerland's first private broadcasters. Plays mainstream pop and rock gold for the
    Basel city region with a strong local identity and Basel-dialect on-air personality.
  format: Adult Contemporary / Hot AC
  contentMix: { music: 0.85, talk: 0.15 }
  targetAudience: Adults 25–55 in the Basel region (Basel-Stadt, Basel-Landschaft, Aargau border)
  distinctive: >-
    Deep local roots (Marktplatz, Basel dialect) combined with a mainstream hits rotation
    spanning current chart entries and feel-good gold; one of Switzerland's oldest surviving
    private radio stations.

