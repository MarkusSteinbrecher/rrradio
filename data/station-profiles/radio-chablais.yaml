  notes: >-
    geo [0,0] in catalog — corrected to Monthey VS [46.255, 6.953].
    FM frequencies not published as MHz values on the station's website (only
    "Valais et Vaud" cantons stated); omitted until verified.
    The XSPF endpoint is CORS-open and is the cheapest now-playing source;
    the broadcaster's own PHP fragments (getlastsongs, getsongonair) are
    richer (cover art filenames, last 4 tracks) but return HTML and have no
    CORS headers — needs proxy fetcher.
