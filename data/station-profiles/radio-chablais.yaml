identity:
  name: Radio Chablais
  shortName: Chablais
  tagline: Suivez-nous, on vous suit
  positioning: La radio régionale du Chablais, de la Riviera et du Pays-d'EnHaut
  logo:
    url: https://assets.radioplayer.org/756/7565018/600/600/l458lrnd.png
    source: radioplayer

organization:
  type: commercial
  owner: Radio Chablais SA
  group: independent
  foundedYear: 1984
  headquarters: { city: Monthey, address: "Rue des Fours 11A, CP 112, 1870 Monthey 1", canton: VS }

profile:
  description: >-
    Regional French-language radio serving the Chablais, Riviera, and
    Pays-d'EnHaut areas across the cantons of Valais and Vaud — a mix of
    current pop hits, French chanson, regional news and sports, live events,
    and local talk.
  format: Hot AC / Regional
  contentMix: { music: 0.70, talk: 0.30 }
  targetAudience: French-speaking adults in the Chablais and Riviera regions
  distinctive: >-
    One of the few private regional stations straddling a cantonal border
    (Valais/Vaud); strong local news and sports coverage alongside mainstream
    pop and French-language music. Runs a family of themed web-radio spin-offs
    (Urban, Rock'N'Blues, Folklore, Francophone, Funk, Flashback/Swiss Made)
    under the same brand. Acquired the Vibration 108 web-radio group in 2017.

