id: country-radio-switzerland

identity:
  name: Country Radio Switzerland
  shortName: CRS
  tagline: "THE BEST OF COUNTRY MUSIC, AND SO MUCH MORE!"
  positioning: Switzerland's only country music radio — 24/7 country and related genres, volunteer-moderated
  logo:
    url: https://assets.radioplayer.org/756/756182/600/600/l458q8r9.png
    source: radioplayer

organization:
  type: commercial
  owner: RadioFreunde GmbH
  group: independent
  foundedYear: 2008
  headquarters: { city: Zürich, address: "Rankstrasse 6, 8032 Zürich", canton: ZH }

profile:
  description: >-
    Switzerland's only dedicated country music radio, on air since 1 December 2008.
    A volunteer-moderated internet station covering Nashville Sound, Americana,
    Bluegrass, Honky Tonk, Rockabilly, Western Swing, Cajun, Blues, and Gospel —
    accessible via internet, Swisscom TV, and Swiss cable networks reaching
    ~3 million households.
  format: Country / Americana
  contentMix: { music: 0.85, talk: 0.15 }
  targetAudience: German-speaking Swiss country fans, with French and English show strands
  distinctive: >-
    Unique in Switzerland as the sole dedicated country station; unusually broad
    sub-genre palette from Bluegrass to Cajun to Gospel; Swiss Hour and Swiss
    Country content alongside mainstream Nashville; volunteer hosts from CH and UK.

music:
  genres:
    - country
    - americana
    - bluegrass
    - honky-tonk
    - rockabilly
    - western-swing
    - cajun
    - country-rock
    - tex-mex
    - gospel
    - blues
  languageShare: { en: high, de: low, fr: low }
  rotationStyle: mixed
  playlistSample:
    sampledAt: 2026-06-22
    source: ICY metadata — https://countryradioswitzerland.ice.infomaniak.ch/crs-128.mp3
    tracks:
      - { artist: Claudia C. Zimmermann, title: Country Saloon (show — no individual track exposed at sample time) }
    notes: >-
      ICY StreamTitle carries the show name ("Claudia C. Zimmermann - Country Saloon")
      during live-moderated hours, not individual track titles. WordPress playlist page
      (countryradio.ch/playlist/) is JS-rendered; no REST endpoint found that returns
      track history without authentication. Individual track titles not sampled.

programming:
  flagshipShows:
    - { name: "René's Country", when: "Wed 16:00–18:00, Sat 08:00–09:00, Sun 21:00–23:00", presenters: [René Hofmann], note: "traditional, bluegrass, western swing, honky tonk, Texas country" }
    - { name: "The Bluegrass Hour", when: "Mon 15:00–16:00, Thu 09:00–10:00, Sun 19:00–20:00", presenters: [Kent Miller], note: "dedicated bluegrass, SBMA member" }
    - { name: "Stomp & Creep (EN)", when: "Tue 13:00–14:00, Wed 09:00–10:00, Sat 20:00–21:00", presenters: [Chris Tanner], note: "rockabilly, psychobilly, 1950s, alternative country; English-language" }
    - { name: "CRS Charts", when: "Wed 15:00–16:00, Sun 15:00–16:00", presenters: [Richard Fischbacher], note: "US singles + album charts, Americana + Texas regional charts" }
    - { name: "Country Saloon (FR)", when: "Mon+Fri+Sat 14:00–15:00 (varies)", presenters: [Claudia Zimmermann], note: "French-language country show" }
    - { name: "Gospel Train", when: "Sun 10:00–11:00", presenters: [René Hofmann], note: "Sunday gospel" }
    - { name: "Special Corner", when: "Mon 09:00–10:00, Fri 17:00–18:00, Sun 17:00–18:00", note: "new releases in country, country-rock, americana" }
    - { name: "Songwriter Special", when: "Mon 20:00–21:00 (monthly)", presenters: [Chris Regez], note: "singer-songwriter focus" }
    - { name: "Bluestime", when: "Wed 20:00–21:00, Sat 21:00–22:00", presenters: [Larry Schmuki] }
    - { name: "Let's Talk About", when: "Sat 10:00–11:00, Sun 14:00–15:00", presenters: [Hämpi Ruf, René Hofmann], note: "artist interviews; podcast/Mixcloud" }
    - { name: "Southern Kitchen", when: "Mon 21:00–22:00, Wed 22:00–23:00, Fri 21:00–22:00", presenters: [Claudia Zimmermann], note: "traditional, modern, rock-influenced" }
  presenters: [René Hofmann, Kent Miller, Chris Tanner, Richard Fischbacher, Claudia Zimmermann, Larry Schmuki, Chris Regez, Hämpi Ruf, Hansruedi Gräf]
  scheduleUrl: https://www.countryradio.ch/programm/

