  notes: >-
    Internet-only station; no FM or DAB identified. Tagline says "comédie
    musicale" but the actual format is broad vocal-jazz/standards/swing. The
    now-playing API (api.rhonefm.allinone.io, site=2) is shared with the
    entire Radio Rhône SA group (Rhône FM, Break Radio, Vertical Radio) — the
    site=2 parameter scopes it to Fréquence Broadway. CORS open. Cover art
    served via the allinone.io media CDN. A dedicated fetcher is needed to
    wire cover art. ICY headers contain a typo URL (frequancebroadway.ch) —
    the correct domain is frequence-broadway.ch.
