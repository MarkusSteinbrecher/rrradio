id: frequence-broadway-radio

identity:
  name: Fréquence Broadway
  shortName: Broadway
  tagline: La radio de la comédie musicale
  positioning: >-
    Jazz, swing, soul and vocal standards — from Ella Fitzgerald and Frank
    Sinatra to Michael Bublé and Diana Krall — broadcast from the Valais.
  logo:
    url: https://assets.radioplayer.org/756/756208/600/600/lh7ig401.png
    source: radioplayer
  brandColor: "#00165F"

organization:
  type: commercial
  owner: Radio Rhône SA
  group: Radio Rhône SA    # sibling stations: Rhône FM, Break Radio, Vertical Radio
  headquarters: { city: Sion, address: "Chemin Saint-Hubert 5, 1950 Sion", canton: VS }

profile:
  description: >-
    Internet-only Swiss radio from the Valais playing jazz standards, swing,
    vocal soul and bossa nova around the clock — a rich mix of classic and
    contemporary artists in the genre, from Nat King Cole to Kandace Springs.
  format: Vocal jazz / swing standards
  contentMix: { music: 1.0, talk: 0.0 }
  targetAudience: adult listeners who enjoy jazz, swing, big-band, soul and vocal standards
  distinctive: >-
    Tagline bills it as a "musical theatre" station, but the actual rotation
    is a broad vocal-jazz/standards/swing/bossa nova format — no musicals
    exclusivity. Internet-only; no FM or DAB transmitters identified.

