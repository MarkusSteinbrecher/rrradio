organization:
  type: commercial
  owner: Radio Fribourg | Freiburg SA (MEDIAparc SA)
  group: RadioFr.
  foundedYear: 1988
  headquarters: { city: Villars-sur-Glâne, address: "Rue du Centre 18, CH-1752 Villars-sur-Glâne", canton: FR }

profile:
  description: >-
    RadioFr. Fribourg is the French-language regional radio for the canton of
    Fribourg, on-air since 1 May 1988. A warm, personality-led Adult
    Contemporary station mixing international pop, French and Francophone
    hits, light rock and oldies — all wrapped around local news, sport,
    and community programming.
  format: Adult Contemporary / Hot AC
  contentMix: { music: 0.70, talk: 0.30 }
  targetAudience: French-speaking adults 25–55 in the canton of Fribourg
  distinctive: >-
    Sole broad-appeal French-language FM station native to the bilingual
    Fribourg canton. Combines a mainstream pop-to-classic-hits rotation with
    genuinely local programming — a Fribourg-made show grid, live Fribourg
    sport coverage, and cultural niches (French chanson, religious slots,
    regional language Intrè-No).

