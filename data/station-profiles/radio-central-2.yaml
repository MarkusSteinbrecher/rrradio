id: radio-central-2

identity:
  name: Radio Central 2
  shortName: Central 2
  tagline: Das Informationsradio
  positioning: >-
    Regional pop/hits/Schlager radio for the Aussenschwyz / Zurichsee /
    Glarnerland area — a sister channel of Radio Central carrying the same
    music and talk programming with its own regional news inserts.
  logo:
    url: https://assets.radioplayer.org/756/756137/600/600/l459q9to.png
    source: radioplayer

organization:
  type: commercial
  owner: CH Media (CH Regionalmedien AG)
  group: CH Media
  foundedYear: 1990   # network launched 3 Nov 1990 as "Radio Schwyz"; Central 2 DAB/web channel derived from it
  headquarters: { city: Luzern, address: "Maihofstrasse 76, 6004 Luzern", canton: LU }  # since 2025-03-25

profile:
  description: >-
    The Aussenschwyz/ZH/SZ/SG/GL regional sister stream of Radio Central,
    Switzerland's largest private broadcaster in central Switzerland (CH Media).
    Carries the same mainstream German-Swiss rotation — pop, Mundart, country
    and Schlager hits — with its own regional news inserts for the areas around
    the upper Zurich Lake, Zürcher Oberland, and Canton Glarus.
  format: Hot AC / Mainstream — pop, Mundart, country, Schlager
  contentMix: { music: 0.85, talk: 0.15 }
  targetAudience: >-
    Broad German-speaking adult audience in Aussenschwyz, upper Zurich Lake
    area, Zürcher Oberland, and Glarnerland (ages 25–55)
  distinctive: >-
    Regional news service for ZH/SZ/SG/GL listeners riding the shared
    Central network rotation; also on DAB+ as a distinct multiplex programme.

