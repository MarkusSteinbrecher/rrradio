    dab: DAB+ nav commented out on ipmusicslow.ch; ip music main has DAB+ but SLOW branch does not
  updatedAt: 2026-06-22
  notes: >-
    Internet-only sister station of IP music (ipmusic.ch). DAB+ is available
    for the main IP music brand across several Swiss regions but NOT for IP music
    SLOW (DAB nav block is commented out on the SLOW site). The playlist.php
    endpoint supplies current/next/previous track + album cover art but has no
    CORS headers — needs the worker proxy. The Icecast status-json at
    live9.avf.ch is CORS-open and can supply a raw now-playing title as fallback.
    Geo [46.948, 7.447] is the catalog placeholder (Bern-area), not the actual
    HQ; real HQ is Préverenges, VD [46.523, 6.528].
