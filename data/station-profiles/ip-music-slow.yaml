id: ip-music-slow

identity:
  name: IP music SLOW
  shortName: IP music SLOW
  tagline: All the best slows, no talk!
  positioning: Internet radio from Switzerland — slow songs, soft pop, love ballads, adult 80s/90s, no DJ talk
  logo:
    url: https://assets.radioplayer.org/756/75610009/600/600/l5uoil9a.png
    source: radioplayer

organization:
  type: internet
  owner: Dany Hofmann / IP worldcom
  group: IP music
  headquarters: { city: Préverenges, address: "CP 43, 1028 Préverenges", canton: VD }

profile:
  description: >-
    Swiss internet-only radio playing a continuous, talk-free rotation of slow
    songs, love ballads and soft pop spanning the 1970s to 2010s — a sister
    channel to the main IP music station, curated by the same Lausanne-area team.
  format: Soft AC / Love Songs / Slow
  contentMix: { music: 1.0, talk: 0.0 }
  targetAudience: Adults 30+ seeking relaxed, non-stop background music
  distinctive: >-
    Fully automated, no presenter voice — 100 % music, all "slow" in the French
    sense (ballads, soft-pop, R&B), with album cover art delivered via its own
    playlist.php JSON endpoint.

