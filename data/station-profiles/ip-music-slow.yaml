meta:
  status: working
  liveness: { onDab: false, inRadioplayer: true }
  provenance:
    owner: ipmusic.ch/ipmusic-pro.php — "Dany Hofmann … dirige IP music … et la société IP worldcom"
    headquarters: ipmusic.ch/ipmusic-pro.php — "IP music - CP 43 - 1028 Préverenges"
    streams: live9.avf.ch/status-json.xsl (CORS-open Icecast multi-mount)
    nowPlaying: ipmusicslow.ch/playlist.php (JSON; no CORS)
