programming:
  flagshipShows:
    - { name: Info Kompakt, when: "Mon–Fri 17:05", note: "regional news and background from Südostschweiz" }
    - { name: Grischa Talk, when: "Tue 06:00 (rpt various)", note: "in-depth regional interview series" }
    - { name: Grischa Soundcheck, when: "Fri 09:40", note: "new music by local GR/GL/SG artists — Livio Biondini" }
    - { name: Minutas Rumantschas, when: "weekly", note: "Romansh-language news and culture — Lucas Batista, Cristina Rantra" }
    - { name: Grischa goht go puura, when: "Mon 08:00", note: "agricultural profiles across Graubünden" }
    - { name: Spirit, when: "Sun 09:00 (rpt Mon 20:00)", note: "religious and ethical discussion" }
    - { name: Sportmagazin, when: "weekly", note: "regional sports" }
