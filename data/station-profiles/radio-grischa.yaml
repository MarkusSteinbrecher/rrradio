id: radio-grischa

identity:
  name: Radio Grischa
  shortName: Grischa
  tagline: Das Radio vu do
  positioning: Das erste Privatradio Graubündens — aktueller Pop und regionale Nachrichten aus dem Südosten
  logo:
    url: https://assets.radioplayer.org/756/756108/600/600/m4cejas6.jpeg
    source: radioplayer

organization:
  type: commercial
  owner: Somedia AG
  group: Somedia
  foundedYear: 1988
  headquarters: { city: Chur, address: "Sommeraustrasse 32, 7007 Chur", canton: GR }

profile:
  description: >-
    Graubünden's first private radio station, on air since 1988. Plays a current
    pop/Hot AC rotation alongside strong regional news coverage for the cantons
    of Graubünden, Glarus, and parts of St. Gallen.
  format: Hot AC
  contentMix: { music: 0.80, talk: 0.20 }
  targetAudience: adult listeners across Graubünden and the eastern Swiss arc
  distinctive: >-
    Deeply embedded in the alpine southeast — weekly Romansh-language
    segment (Minutas Rumantschas), agricultural features (Grischa goht go
    puura), and a live studio webcam stream alongside the audio broadcast.
    Backed by the Somedia regional media house.

