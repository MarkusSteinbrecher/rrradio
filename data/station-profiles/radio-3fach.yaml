profile:
  description: >-
    Switzerland's first licensed youth radio, now a non-commercial community station
    in Lucerne broadcasting alternative, indie, electronic, and underground music
    alongside local journalism and youth culture programming.
  format: Alternative / community freeform
  contentMix: { music: 0.75, talk: 0.25 }
  targetAudience: ages 13–30, German-speaking Central Switzerland
  distinctive: >-
    Show-grid driven programming by and for Lucerne youth culture: weekday morning
    news-entertainment, specialist genre shows (hip-hop, indie/experimental, electronic
    residencies), and a Kick Ass Award celebrating the best Central Swiss songs of the
    year. Playlist skews heavily Swiss and European independent releases.

