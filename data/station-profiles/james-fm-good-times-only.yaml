id: james-fm-good-times-only

identity:
  name: JAMES FM - good times only
  shortName: JAMES FM
  tagline: good times only
  positioning: >-
    Music-first Swiss private radio — "MORE MUSIC. LESS TALK." — anchored in
    classic and current pop/rock hits for the 40+ listener in Central Switzerland.
  logo:
    url: https://assets.radioplayer.org/756/756148/600/600/led809c6.png
    source: radioplayer
  brandColor: null   # not confirmed

organization:
  type: commercial
  owner: Bespoke Media Group GmbH
  group: independent / commercial
  foundedYear: 2016
  headquarters: { city: Hünenberg, canton: ZG }

profile:
  description: >-
    Switzerland's independently-owned Hot AC station, live since 1 February 2016.
    No major publisher, no state subsidies — just a crate of feel-good classics
    and current pop/rock, light news on the hour (SRF bulletins since 2018), and
    the stated promise: "good times only."
  format: Hot AC (Adult Contemporary)
  contentMix: { music: 0.95, talk: 0.05 }
  targetAudience: adults aged 40+ in Central Switzerland and Greater Zurich
  distinctive: >-
    Switzerland's first private radio to enter a formal programming partnership
    with SRG (2018). "FM" explicitly stands for "FOR MUSIC", not a frequency —
    the station is DAB/stream only. Trademark-registered "good times only" brand.

