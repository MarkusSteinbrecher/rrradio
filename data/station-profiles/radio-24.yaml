profile:
  description: >-
    Zürich's leading private radio and Switzerland's original pirate station —
    founded 1979 by Roger Schawinski, broadcast from Italy to break the SRG
    monopoly. Today a mainstream German-language hot-AC hit station plus 30+
    themed web channels.
  format: Hot AC / CHR
  contentMix: { music: 0.85, talk: 0.15 }
  targetAudience: broad adult mainstream in the Zürich region
  distinctive: >-
    45-year heritage as Switzerland's first private/pirate radio (Pizzo
    Groppera, 1979). Listener "Musik-Jury" voting shapes the playlist.

