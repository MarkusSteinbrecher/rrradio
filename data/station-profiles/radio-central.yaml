id: radio-central

identity:
  name: Radio Central
  shortName: Central
  tagline: Das Radio mit Herz aus der Zentralschweiz
  positioning: >-
    Switzerland's most-listened-to private radio in central Switzerland —
    broadest music mix (pop, Mundart, country, Schlager, gold) with
    deep regional news and live Schwingen coverage.
  logo:
    url: https://assets.radioplayer.org/756/756136/600/600/l45ad97z.png
    source: radioplayer

organization:
  type: commercial
  owner: CH Media (CH Regionalmedien AG)
  group: CH Media
  foundedYear: 1990   # launched 3 November 1990 as "Radio Schwyz" from Ibach
  headquarters: { city: Luzern, address: "Postfach 3740, 6002 Luzern", canton: LU }  # relocated 2025-03-25

profile:
  description: >-
    The flagship private radio of central Switzerland, launched in 1990 as
    "Radio Schwyz" and now reaching 192,000 listeners daily. Part of CH Media
    since 2022, it serves the six Innerschweiz cantons plus Glarus with a broad
    rotation of pop, Mundart, country, Schlager, and classic hits, anchored by
    strong regional news and live Schwingfest coverage.
  format: Hot AC / Gold / Mainstream — pop, Mundart, country, Schlager, classic hits
  contentMix: { music: 0.80, talk: 0.20 }
  targetAudience: >-
    German-speaking adults 25–55 in Central Switzerland (LU, SZ, ZG, UR, OW, NW)
    with strong affinity to Swiss regional culture (Schwingen, Ländler)
  distinctive: >-
    Broadest music mix among Swiss private stations by self-description; live
    Schwingfest coverage of 20+ festivals per year; dedicated Ländler/Jodel
    wish-concert block; Kafi Central lifestyle brand; highest average listening
    duration among Swiss private stations (H2 2024).

