profile:
  description: >-
    Swiss French-language pop radio serving Vaud and the Lake Geneva basin —
    a tight Adult Contemporary rotation mixing French chanson, international
    pop hits, and 80s/90s gold, anchored by live talk-drive shows throughout
    the day and strong local news coverage.
  format: Adult Contemporary / Pop
  contentMix: { music: 0.75, talk: 0.25 }
  targetAudience: 25–54 year-olds in Romandy, especially Vaud and the Geneva region
  distinctive: >-
    Top private radio in French-speaking Switzerland by reach; covers Lausanne
    and the entire romand region via FM and DAB+; newsroom produces multiple
    hourly bulletins; lineup balances French and international pop with a
    significant classic-hits layer (80s/90s) alongside current chart titles.

