id: break-radio

identity:
  name: Break Radio
  shortName: Break Radio
  tagline: "la radio hiphop en Valais"
  positioning: Hip-hop and R&B internet radio from the Valais canton, Switzerland
  logo:
    url: https://assets.radioplayer.org/756/756207/600/600/lh7iu1yw.jpeg
    source: radioplayer
  brandColor: "#FFAA00"   # CSS --primary-500: rgb(255,170,0)

organization:
  type: commercial
  owner: Radio Rhône SA
  group: Radio Rhône SA (Rhône FM / Break Radio / Vertical Radio / Fréquence Broadway / Rhône TV)
  headquarters: { city: Sion, address: "Chemin Saint-Hubert 5, 1950 Sion", canton: VS }

profile:
  description: >-
    Break Radio is the hip-hop and R&B internet station from Valais, operated by Radio Rhône SA
    alongside Rhône FM, Vertical Radio, and Fréquence Broadway. It streams a current-hits rotation
    heavy on French-language rap and R&B, with mainstream English-language pop crossovers.
  format: Hip-hop / R&B / rap (current rotation)
  contentMix: { music: 1.0, talk: 0.0 }
  targetAudience: younger hip-hop and R&B fans in French-speaking Valais and online
  distinctive: >-
    Internet-only station in the Radio Rhône SA group, narrowcasting hip-hop and R&B to an
    audience underserved by the flagship Rhône FM adult-hits format.

