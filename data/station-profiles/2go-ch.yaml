profile:
  description: >-
    Radio 2Go is a Swiss internet and DAB+ station based in Brugg, Aargau, broadcasting
    adult contemporary pop and gold tracks Switzerland-wide. The station operates without
    an FM licence, positioning itself as a pure-digital broadcaster under the slogan
    "Schweizweit Freizeit" (Switzerland-wide leisure).
  format: Adult Contemporary / Easy Listening gold
  contentMix: { music: 0.95, talk: 0.05 }
  targetAudience: Adults 35+ interested in leisure and culture
  distinctive: >-
    One of Switzerland's deliberately FM-free stations, relying entirely on DAB+ and
    online streaming. Founder Reto Wettstein publicly criticised the Swiss Federal
    Council's decision to postpone the FM shutdown, calling it "market distortion"
    disadvantaging pure-digital operators. Added a Liechtenstein edition (Jan 2025)
    with a morning show.

