profile:
  description: >-
    Zürich's premium adult radio — classic hits from four decades alongside
    sharp daily journalism and expert talk on health, finance, law, wine,
    film and lifestyle. Founded in 2008 by media entrepreneur Roger Schawinski
    out of the predecessor Radio Tropic; deliberately positioned against
    mainstream pop and youth radio.
  format: Adult Contemporary / Talk
  contentMix: { music: 0.65, talk: 0.35 }
  targetAudience: Adults 30–60 in greater Zürich
  distinctive: >-
    Unusually high talk-to-music ratio for a Swiss private radio; columnists
    rotate every morning, and the evening block features founder Roger
    Schawinski's own interview and debate formats. Music rotation stays firmly
    in the 1970s–2000s classic-hits lane ("Nur für Erwachsene").

