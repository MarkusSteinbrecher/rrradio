profile:
  description: >-
    Swiss national DAB+/stream station from CH Media spinning the greatest hits
    of the 1980s and 1990s — the most 80s tracks of any Swiss radio, plus the best
    90s. No FM transmitters; available across all of Deutschschweiz via DAB+ and app.
  format: Gold / Greatest Hits (80s–90s)
  contentMix: { music: 0.95, talk: 0.05 }
  targetAudience: 35–55 German-speaking Swiss adults nostalgic for 1980s and 1990s pop
  distinctive: >-
    Narrowly focused decade window — almost exclusively 80s and 90s international pop
    and rock, with listener "Musik-Jury" voting and artist-themed web sub-channels
    (ABBA, Beatles, Bon Jovi, Queen, Tina Turner, etc.). DAB+-only broadcast,
    no legacy FM footprint.

