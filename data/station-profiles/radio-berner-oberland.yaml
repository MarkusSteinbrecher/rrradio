id: radio-berner-oberland

identity:
  name: Radio Berner Oberland
  shortName: Radio BeO
  tagline: Dini Region. Dini Musig. Dis Radio.
  positioning: Regional private radio for the Bernese Oberland — local news, Swiss and international pop, community voice
  logo:
    url: https://www.radiobeo.ch/wp-content/themes/radiobeo/img/beo-logo-wrapp.png
    source: broadcaster

organization:
  type: commercial
  owner: Radio Berner Oberland AG
  group: independent
  foundedYear: 1987
  headquarters:
    city: Interlaken
    address: "Aareckstrasse 6, 3800 Interlaken"
    canton: BE

profile:
  description: >-
    Radio BeO is the private regional radio station for the Bernese Oberland,
    on air since 6 June 1987. It blends mainstream pop/rock hits with Volksmusik
    (Swiss folk), extensive local news, regional sports coverage, and community
    programming in Bernese German.
  format: Adult Contemporary / Regional
  contentMix: { music: 0.70, talk: 0.30 }
  targetAudience: Adults 25–55 across the Bernese Oberland region
  distinctive: >-
    Strong community anchor: ~3,000 interviews and ~7,000 regional news items
    produced annually. One of the few Swiss private stations that actively programmes
    Volksmusik (BeO-Stubete) alongside mainstream pop. Listeners can call/WhatsApp
    the studio during live shows.

