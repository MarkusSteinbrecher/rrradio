id: goat-greatest-hits-radio

identity:
  name: GOAT Greatest Hits Radio
  shortName: GOAT Radio
  tagline: Greatest Hits of All Time
  positioning: >-
    Swiss retro radio playing the best rock and pop hits of the 80s, 90s, and
    2000s — 24/7, no subscription, CarPlay-ready.
  logo:
    url: https://assets.radioplayer.org/756/756191/600/600/ler6q1en.png
    source: radioplayer

organization:
  type: commercial
  owner: Digital Media Distribution AG
  group: 20 Minuten / TX Group
  headquarters: { city: Zürich, canton: ZH }

profile:
  description: >-
    GOAT Radio (Greatest Of All Time) is a Swiss internet and FM station from
    the 20 Minuten universe, playing the definitive rock and pop classics of the
    1980s, 1990s, and early 2000s — Bon Jovi, Roxette, Michael Jackson, The Cure,
    Madonna and their era — without talk, news or commercials interruption.
  format: Classic Hits / Gold (80s–90s–2000s pop-rock)
  contentMix: { music: 0.98, talk: 0.02 }
  targetAudience: Swiss adults 30–55 who grew up with 80s and 90s mainstream pop and rock
  distinctive: >-
    Pure rotation of certified greatest hits — no deep cuts, no current chart
    music, no extended talk. Tight gold format in a Swiss digital/FM package
    distributed by Digital Media Distribution AG (DMD2).

