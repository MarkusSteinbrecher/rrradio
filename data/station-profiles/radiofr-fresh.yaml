id: radiofr-fresh

identity:
  name: RadioFr. Fresh
  shortName: Fresh
  tagline: La nurserie des hits en DAB+ partout en suisse romande
  positioning: La première radio nouveautés de Suisse romande en DAB+
  logo:
    url: https://assets.radioplayer.org/756/756147/600/600/l5uotg6p.png
    source: radioplayer

organization:
  type: commercial
  owner: Radio Fribourg | Freiburg SA (MEDIAparc SA)
  group: RadioFr.
  foundedYear: 1988   # parent Radio Fribourg founded 1 May 1988; Fresh launch year unconfirmed
  headquarters: { city: Villars-sur-Glâne, address: "Rue du Centre 18, CH-1752 Villars-sur-Glâne", canton: FR }

profile:
  description: >-
    RadioFr. Fresh is the hits-first web/DAB+ channel of the RadioFr. group,
    broadcasting the latest chart releases 24/7 across French-speaking
    Switzerland. Its slogan calls it "la nurserie des hits" — the hits nursery
    — underscoring a format built entirely on new releases and current chart
    titles.
  format: CHR / Current Hits (Pop, EDM, R&B)
  contentMix: { music: 0.97, talk: 0.03 }
  targetAudience: 15–35 French-speaking Swiss listeners seeking the newest chart hits
  distinctive: >-
    Internet-only origin (no FM allocation), first distributed purely via
    DAB+ across all of Suisse romande. Tightly current-hits rotated — nearly
    every track is a recent chart or viral hit. Morning show (Les Neuneus)
    and Friday/Sunday club chart shows are the only hosted breaks.

