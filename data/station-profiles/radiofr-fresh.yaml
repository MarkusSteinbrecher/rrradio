    No FM frequencies — Fresh is a DAB+/internet-only channel of the RadioFr.
    group. The now-playing API cover field always returns the generic Fresh
    banner image, not per-track artwork. Parent broadcaster Radio Fribourg
    founded 1988; Fresh launch year not confirmed from public sources.
    The Frapp platform (api.frapp.ch) serves the now-playing data for all
    RadioFr. web channels (audiostream IDs 1–15+), sharing the same API.
