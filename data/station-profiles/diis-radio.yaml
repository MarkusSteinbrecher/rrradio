profile:
  description: >-
    Valais-born internet and DAB+ station founded in 2014 by Patrick Studer, broadcasting
    a curated mix of oldies, pop, Schlager, Latin, alpine and folk music with a "Good Times"
    feel — emphasis on audio quality (WAV source files) and listener-friendly warmth.
  format: Oldies / Schlager / Hot Mix
  contentMix: { music: 0.95, talk: 0.05 }
  targetAudience: German-speaking Swiss adults seeking classic hits and nostalgic music
  distinctive: >-
    Founded by a veteran Wallis broadcaster with roots in 1980s Radio Matterhorn; WAV-only
    source material as a quality pledge; named shows in Wallis German dialect (Oldieladu,
    Alpgaudi, Biscuits, IHDG); coverage via Swisscom TV and cable reaching ~3.2 million
    Swiss households.

