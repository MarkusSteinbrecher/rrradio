profile:
  description: >-
    Swiss French-language alternative music radio from the Jura — rock spirit,
    a genuinely eclectic playlist (electro, indie, reggae, hip-hop, soul, jazz)
    and no mainstream pop.
  format: Alternative / eclectic
  contentMix: { music: 0.95, talk: 0.05 }
  targetAudience: younger alternative listeners across the Arc Jurassien
  distinctive: >-
    Crate-digger rotation crossing eras and genres within a single hour — the
    opposite of a current-hits pop station. Went music-first in 2022.

