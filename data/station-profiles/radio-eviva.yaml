identity:
  name: Radio EVIVA
  shortName: Eviva
  tagline: Der ErVolkssender
  positioning: Der Schweizer Volksmusik-Sender — Ländler, Jodel, Blasmusik und Schlager seit 1992
  logo:
    url: https://assets.radioplayer.org/756/756139/600/600/l45aiwaq.png
    source: radioplayer

organization:
  type: commercial
  owner: CH Regionalmedien AG
  group: CH Media
  foundedYear: 1992
  headquarters: { city: Luzern, address: "Maihofstrasse 76, 6006 Luzern", canton: LU }

profile:
  description: >-
    Switzerland's only radio station dedicated exclusively to Swiss folk music —
    Ländler, Jodel, Blasmusik, and Schlager — with 80–90% pure Swiss Volksmusik
    content. Listener-driven, with live wish concerts and specialty shows curated
    by genre experts.
  format: Swiss Volksmusik / Folk
  contentMix: { music: 0.9, talk: 0.1 }
  targetAudience: >-
    Swiss German-speaking listeners who love traditional Alpine and folk music;
    strong following in central Switzerland
  distinctive: >-
    Sole Swiss broadcaster dedicated entirely to Volksmusik. No FM license —
    reaches its audience exclusively via DAB+, cable, satellite, and internet.
    Offers specialist shows for every sub-genre (Jodel, Blasmusik, Ländler-Oldies)
    and a member magazine (Eviva-Zytig). Membership program lets listeners
    directly support the folk music genre.

