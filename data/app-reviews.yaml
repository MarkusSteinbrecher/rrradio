    date: "2026-10-18"
    storefront: es
    lang: es
    author: ahouke
    rating: 5
    version: "1.0"
    title: "Sencilla y perfecta"
    text: "Sin rastreadores, sin publicidad, con alarma para despertarse con una emisora y temporizador, gracias!"

