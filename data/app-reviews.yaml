# App Store review quotes shown on https://rrradio.org/ios (they follow the
# NO CATCH station of the landing page, one scroll stop each).
#
# Curated by hand: only what is listed under `reviews` appears on the site,
# and nothing changes there without a commit. The page never contacts Apple;
# vite.config.ts reads this file at build time and puts the quotes into the
# page (see docs/operations.md, "App Store review quotes").
#
# `npm run app-reviews` prints reviews from Apple's public customer-reviews
# feed that are neither listed nor ignored here, ready to paste.
#
# Rules:
#   - Quote faithfully: original language and wording. Shorten only with a
#     visible ellipsis (…).
#   - `lang` is the language of the quote (BCP 47), so browsers and screen
#     readers treat it correctly.
#   - `storefront` is the two-letter App Store country the review was left in.
#   - No reviews by the project's own maintainers: put their id under `ignored`.
#   - No review markup for search engines (no Review / AggregateRating JSON-LD).

reviews:
