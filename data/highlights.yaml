# rrradio editorial highlights — the "Featured by rrradio" rail in the
# Browse discovery surface (rendered by the iOS app today; web/Android
# planned).
#
# This file is the SOURCE OF TRUTH. `tools/build-highlights.mjs` validates
# it against the published catalog and writes public/highlights.json, which
# is served at https://rrradio.org/highlights.json. Clients fetch that file,
# cache the last good copy, and resolve each `station` id against the catalog
# at render time — so the featured set changes with a web deploy, no native
# release needed.
#
#   npm run highlights        — regenerate public/highlights.json
#   npm run check-highlights  — verify the committed JSON matches this file
#                               AND audit the runway (see below)
#
# Each entry references a PUBLISHED catalog station by id (the `id:` field in
# data/stations.yaml; only working / stream-only / icy-only stations ship).
# Only the curated fields live here — name, logo, genre, and flag come from
# the catalog.
#
# Fields
#   station   (required) — catalog station id, e.g. builtin-grrif
#   badge     (required) — { label, accent? }
#                          label:  short editorial tag (UPPERCASED in the UI)
#                          accent: optional #rrggbb card accent; omit to use
#                                  the app's accent token (green light / yellow dark)
#   blurb     (optional) — one-line editorial note (≤ ~3 lines on a card)
#   startsOn  (optional) — YYYY-MM-DD; the entry is hidden before this day
#   endsOn    (optional) — YYYY-MM-DD; the entry is hidden after this day
#
# Order matters: entries render left-to-right in the rail. Clients show the
# first 8 visible entries. A row whose `station` isn't published is a build
# error, so this file can't reference a station that won't render.
#
# ── Label taxonomy ──────────────────────────────────────────────────────
# Every badge label must be one of:
#   1. DESCRIPTIVE of the station — "Genre-less gem", "Late-night pick",
#      "Seattle institution". Claims nothing about process; always safe.
#   2. TRUE OF THE PROCESS — "Station of the week" only on entries in the
#      windowed rotation queue below; "Hand-picked" (the maintainer picks,
#      and says so); "New on rrradio" only for stations added within the
#      last few weeks.
#   3. BACKED BY NAMED DATA — e.g. "Most played this month" — only once
#      we derive it from telemetry and can show the numbers.
# No invented authority: there is no editorial team, so no "Editor's
# pick", no "Staff favourite", no implied voting. Nobody pays for
# placement, ever.
#
# ── Weekly rotation ─────────────────────────────────────────────────────
# The "Station of the week" slot is a queue of windowed entries (Monday
# startsOn → Sunday endsOn), scheduled several weeks ahead. Clients hide
# entries outside their window, so the rail rotates by itself — no commit,
# no deploy. Keep the queue first in the file (the current week's pick
# leads the rail) and keep a few evergreen, un-windowed entries below it
# so the rail never thins out.
#
# `npm run check-highlights` (CI catalog job) audits the runway and fails
# when the queue's last window ends < 14 days out, or when any day in the
# next 28 would show fewer than 3 entries. When it goes red: append the
# next weeks here, pick stations not already featured below, write an
# accurate blurb, run `npm run highlights`, commit both files.

